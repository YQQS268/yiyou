<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>怡悠</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #ededed;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header {
    height: 52px;
    background: #f7f7f7;
    border-bottom: 1px solid #d9d9d9;
    display: flex;
    align-items: center;
    padding: 0 14px;
    flex-shrink: 0;
  }
  .header .avatar {
    width: 36px; height: 36px;
    border-radius: 6px;
    background: #6d8adf;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    margin-right: 10px;
    user-select: none;
  }
  .header .name { font-size: 16px; font-weight: 600; color: #191919; }
  .header .status { font-size: 12px; color: #999; margin-left: 8px; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .time-divider {
    text-align: center;
    font-size: 11px;
    color: #b2b2b2;
    margin: 2px 0;
    user-select: none;
  }
  .msg { display: flex; align-items: flex-start; gap: 8px; }
  .msg.user { flex-direction: row-reverse; }
  .msg .avatar {
    width: 38px; height: 38px;
    border-radius: 6px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    color: #fff;
    user-select: none;
  }
  .msg.yiyou .avatar { background: #6d8adf; }
  .msg.user .avatar { background: #95ec69; color: #191919; }
  .avatar { position: relative; overflow: hidden; }
  .avatar .avatar-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: none;
  }
  .avatar .avatar-img.loaded { display: block; }
  .msg .body { max-width: 72%; display: flex; flex-direction: column; }
  .msg.user .body { align-items: flex-end; }
  .msg .bubble {
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 15px;
    line-height: 1.5;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .msg.yiyou .bubble {
    background: #fff;
    color: #191919;
    border-top-left-radius: 2px;
  }
  .msg.user .bubble {
    background: #95ec69;
    color: #191919;
    border-top-right-radius: 2px;
  }
  .msg .meta { font-size: 10px; color: #b2b2b2; margin-top: 3px; user-select: none; }
  .bubble-img {
    max-width: 200px;
    max-height: 260px;
    border-radius: 4px;
    display: block;
    margin-bottom: 4px;
  }
  #imgBtn {
    padding: 0 14px;
    background: #e0e0e0;
    color: #191919;
    font-size: 20px;
    font-weight: 600;
  }
  #imgBtn:hover { background: #d0d0d0; }
  .img-preview {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: #f7f7f7;
    border-top: 1px solid #d9d9d9;
  }
  #imgPreviewList {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    overflow-x: auto;
  }
  .thumb-item { position: relative; }
  .thumb-item img {
    height: 56px;
    border-radius: 4px;
    display: block;
  }
  .thumb-item .thumb-del {
    position: absolute;
    top: -6px;
    right: -6px;
    border: none;
    background: #e0e0e0;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    cursor: pointer;
    line-height: 1;
    font-size: 13px;
  }
  #imgPreviewClear {
    border: none;
    background: #e0e0e0;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    cursor: pointer;
    line-height: 1;
    font-size: 14px;
  }

  .typing .bubble {
    display: flex; gap: 4px; align-items: center; padding: 12px 14px;
  }
  .typing .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #b2b2b2;
    animation: blink 1.2s infinite;
  }
  .typing .dot:nth-child(2) { animation-delay: 0.2s; }
  .typing .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }

  .input-bar {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    background: #f7f7f7;
    border-top: 1px solid #d9d9d9;
    flex-shrink: 0;
  }
  .input-bar input {
    flex: 1;
    border: 1px solid #e0e0e0;
    background: #fff;
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 15px;
    outline: none;
    font-family: inherit;
  }
  .input-bar input:focus { border-color: #6d8adf; }
  .input-bar button {
    border: none;
    background: #6d8adf;
    color: #fff;
    padding: 0 20px;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
  }
  .input-bar button:hover { background: #5a7bd6; }
  .input-bar button:disabled { background: #b9c6ea; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="header">
    <div class="avatar" id="yiyouAvatar"><span class="avatar-text">怡</span></div>
    <div class="name">怡悠</div>
    <div class="status">在线</div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="img-preview" id="imgPreview" style="display:none">
    <div id="imgPreviewList"></div>
    <button id="imgPreviewClear" type="button">×</button>
  </div>

  <div class="input-bar">
    <button id="imgBtn" type="button">＋</button>
    <input id="input" type="text" placeholder="说点什么…" autocomplete="off">
    <button id="send">发送</button>
  </div>
  <input id="imgInput" type="file" accept="image/jpeg,image/png,image/gif,image/webp" style="display:none">

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const imgBtn = document.getElementById('imgBtn');
  const imgInput = document.getElementById('imgInput');
  const imgPreview = document.getElementById('imgPreview');
  const imgPreviewList = document.getElementById('imgPreviewList');
  const imgPreviewClear = document.getElementById('imgPreviewClear');

  // 待发送的图片（选图后暂存，点发送时随消息一起发），最多 5 张
  let pendingImages = []; // [{ dataUrl, name }]

  // 渲染待发送图片缩略图列表，每张可单独删除
  function renderThumbs() {
    imgPreviewList.innerHTML = '';
    pendingImages.forEach((img, idx) => {
      const item = document.createElement('div');
      item.className = 'thumb-item';
      const im = document.createElement('img');
      im.src = img.dataUrl;
      im.alt = '';
      const del = document.createElement('button');
      del.className = 'thumb-del';
      del.type = 'button';
      del.textContent = '×';
      del.addEventListener('click', () => {
        pendingImages.splice(idx, 1);
        renderThumbs();
      });
      item.appendChild(im);
      item.appendChild(del);
      imgPreviewList.appendChild(item);
    });
    imgPreview.style.display = pendingImages.length > 0 ? 'flex' : 'none';
  }

  // 会话状态在后端 session.json，前端不再自己维护 messages 数组

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function nowTime() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function addTimeDivider(text) {
    const div = document.createElement('div');
    div.className = 'time-divider';
    div.textContent = text;
    messagesEl.appendChild(div);
  }

  // 头像图片：加载成功显示图片、盖住文字色块；加载失败则移除图片，保留文字
  function attachAvatarImg(avatarEl, src) {
    const img = document.createElement('img');
    img.className = 'avatar-img';
    img.src = src;
    img.alt = '';
    img.onload = function () { img.classList.add('loaded'); };
    img.onerror = function () { img.remove(); };
    avatarEl.appendChild(img);
  }

  // 顶栏怡悠头像
  attachAvatarImg(document.getElementById('yiyouAvatar'), '/avatar_yiyou.png');

  function addBubble(who, text, showMeta = true, time = null, image = null) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + who;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    const avatarText = document.createElement('span');
    avatarText.className = 'avatar-text';
    avatarText.textContent = who === 'yiyou' ? '怡' : '我';
    avatar.appendChild(avatarText);
    attachAvatarImg(avatar, who === 'yiyou' ? '/avatar_yiyou.png' : '/avatar_user.png');
    wrap.appendChild(avatar);

    const body = document.createElement('div');
    body.className = 'body';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (image) {
      const img = document.createElement('img');
      img.className = 'bubble-img';
      img.src = image;
      img.alt = '';
      bubble.appendChild(img);
    }
    if (text) {
      const span = document.createElement('span');
      span.textContent = text;
      bubble.appendChild(span);
    }
    body.appendChild(bubble);

    if (showMeta) {
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = time || nowTime();
      body.appendChild(meta);
    }

    wrap.appendChild(body);
    messagesEl.appendChild(wrap);
    scrollBottom();
    return wrap;
  }

  // 把怡悠的一条回复按空行拆成多条短气泡（像微信连发），只有最后一条显示时间
  function addYiyouReply(text, time = null) {
    const parts = String(text || '').split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
    if (parts.length === 0) return;
    parts.forEach((p, i) => addBubble('yiyou', p, i === parts.length - 1, time));
  }

  // 末尾带 // 表示"整条一个气泡"，不按标点拆；返回剥离后的文本与标记
  function detectWholeMark(text) {
    const s = String(text || '');
    const t = s.trimEnd();
    if (t.endsWith('//')) {
      return { text: t.slice(0, -2).trimEnd(), whole: true };
    }
    return { text: s, whole: false };
  }

  // 用户的消息按标点拆成多条短气泡（像微信连发）；末尾带 // 则整条一个气泡
  function addUserReply(text, time = null) {
    const d = detectWholeMark(text);
    let parts;
    if (d.whole) {
      parts = d.text ? [d.text] : [];
    } else {
      parts = d.text
        .replace(/([，。！？!?…])/g, '$1\u0001')
        .split('\u0001')
        .map(s => s.trim())
        .filter(Boolean);
    }
    if (parts.length === 0) return;
    parts.forEach((p, i) => addBubble('user', p, i === parts.length - 1, time));
  }

  function showTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg yiyou typing';
    wrap.id = 'typing';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '怡';
    wrap.appendChild(avatar);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    for (let i = 0; i < 3; i++) {
      const dot = document.createElement('span');
      dot.className = 'dot';
      bubble.appendChild(dot);
    }
    wrap.appendChild(bubble);

    messagesEl.appendChild(wrap);
    scrollBottom();
  }

  function hideTyping() {
    const el = document.getElementById('typing');
    if (el) el.remove();
  }

  async function sendChat(msgs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 120000);
    try {
      const resp = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: msgs }),
        signal: controller.signal
      });
      const data = await resp.json();
      if (!resp.ok || data.error) {
        throw new Error(data.error || ('请求失败 ' + resp.status));
      }
      return data.reply;
    } catch (err) {
      if (err.name === 'AbortError') {
        throw new Error('她好像卡了一下，稍等或再发一次试试');
      }
      throw err;
    } finally {
      clearTimeout(timer);
    }
  }

  async function onSend() {
    const text = inputEl.value.trim();
    const imgs = pendingImages.slice();
    if (!text && imgs.length === 0) return;
    inputEl.value = '';
    pendingImages = [];
    renderThumbs();
    // 本地先显示：每张图片单独一个气泡，文字走逗号拆多条气泡（图+文时只在最后显示时间）
    if (imgs.length > 0) {
      imgs.forEach((img, i) => addBubble('user', '', !text && i === imgs.length - 1, null, img.dataUrl));
    }
    if (text) {
      addUserReply(text);
    }
    sendBtn.disabled = true;
    showTyping();
    try {
      const msg = { role: 'user', content: detectWholeMark(text).text };
      if (imgs.length > 0) {
        msg.images = imgs.map(i => i.dataUrl);
        msg.fileNames = imgs.map(i => i.name);
      }
      // 只发这一条新消息，历史上下文由后端从 session.json 拼接
      const reply = await sendChat([msg]);
      hideTyping();
      addYiyouReply(reply);
    } catch (err) {
      hideTyping();
      addBubble('yiyou', '（出错了：' + err.message + '）');
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', onSend);
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing) {
      e.preventDefault();
      onSend();
    }
  });

  // 把文件读成 base64 data URL（GIF 不压缩，保留动画）
  function readFileAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('读取失败'));
      reader.readAsDataURL(file);
    });
  }

  // 把图片压缩到最长边不超过 maxSide，返回 JPEG data URL
  function compressImage(file, maxSide) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = function () {
        let w = img.width, h = img.height;
        if (Math.max(w, h) > maxSide) {
          const scale = maxSide / Math.max(w, h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('读取失败'));
      };
      img.src = url;
    });
  }

  // 选图：点"＋"触发文件选择；选完压缩并显示预览（GIF 不压缩保留动画）
  imgBtn.addEventListener('click', () => imgInput.click());
  imgInput.addEventListener('change', async () => {
    const file = imgInput.files[0];
    imgInput.value = '';
    if (!file) return;
    if (pendingImages.length >= 5) {
      addBubble('yiyou', '（一次最多发 5 张图片）');
      return;
    }
    if (['image/jpeg', 'image/png', 'image/gif', 'image/webp'].indexOf(file.type) === -1) {
      addBubble('yiyou', '（只支持 jpg / png / gif / webp 图片）');
      return;
    }
    try {
      const dataUrl = (file.type === 'image/gif')
        ? await readFileAsDataUrl(file)
        : await compressImage(file, 1600);
      pendingImages.push({ dataUrl, name: file.name });
      renderThumbs();
    } catch (err) {
      addBubble('yiyou', '（图片读取失败：' + err.message + '）');
    }
  });
  imgPreviewClear.addEventListener('click', () => {
    pendingImages = [];
    renderThumbs();
  });

  // 拉取当前会话（后端 session.json）
  async function fetchSession() {
    try {
      const resp = await fetch('/session');
      if (!resp.ok) return [];
      const data = await resp.json();
      return data.messages || [];
    } catch (err) {
      return [];
    }
  }

  // 渲染历史会话：有历史就直接显示，不重新开场
  function renderSession(msgs) {
    for (const m of msgs) {
      const t = m.time ? m.time.slice(11, 16) : null;
      if (m.role === 'user') {
        const imgs = m.images || (m.image ? [m.image] : []);
        if (imgs.length > 0) {
          const hasText = m.content && m.content !== '[图片]';
          imgs.forEach((img, i) => addBubble('user', '', !hasText && i === imgs.length - 1, t, img));
          if (hasText) addUserReply(m.content, t);
        } else {
          addUserReply(m.content, t);
        }
      } else if (m.role === 'assistant') {
        addYiyouReply(m.content, t);
      }
    }
  }

  // 打开页面：先接上旧会话；只有服务器重启后（session 为空）才让怡悠开场问候
  (async function opening() {
    addTimeDivider('今天');
    const history = await fetchSession();
    if (history.length > 0) {
      renderSession(history);
      return;
    }
    showTyping();
    try {
      const reply = await sendChat([]);
      hideTyping();
      addYiyouReply(reply);
    } catch (err) {
      hideTyping();
      addBubble('yiyou', '（连接失败：' + err.message + '。请确认已启动 app.py 并填好 API Key。）');
    }
  })();
</script>
</body>
</html>
